; [EN] Hide the PHP version and apply conservative application limits.
; [PL] Ukryj wersję PHP i zastosuj ostrożne limity aplikacji.
expose_php = Off
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
post_max_size = 64M
upload_max_filesize = 64M

; [EN] Reduce path-info ambiguity for FastCGI execution.
; [PL] Ogranicz niejednoznaczność path-info podczas wykonywania FastCGI.
cgi.fix_pathinfo = 0

; [EN] Secure session-cookie defaults for the HTTPS-only site.
; [PL] Bezpieczne domyślne ustawienia cookies sesji dla strony wyłącznie HTTPS.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
