; Hide the PHP version and apply conservative application limits.
expose_php = Off
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
post_max_size = 64M
upload_max_filesize = 64M

; Reduce path-info ambiguity for FastCGI execution.
cgi.fix_pathinfo = 0

; Secure session-cookie defaults for the HTTPS-only site.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
