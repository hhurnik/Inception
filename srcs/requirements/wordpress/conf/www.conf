; [EN] This pool executes WordPress as Debian's unprivileged web user.
; [PL] Ta pula wykonuje WordPressa jako nieuprzywilejowany użytkownik webowy Debiana.
[www]
user = www-data
group = www-data

; [EN] Listen on the private Docker network, not on a published host port.
; [PL] Nasłuchuj w prywatnej sieci Dockera, a nie na publikowanym porcie hosta.
listen = 0.0.0.0:9000

; [EN] A small dynamic pool is sufficient for the educational VM.
; [PL] Mała dynamiczna pula wystarcza dla edukacyjnej VM.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; [EN] The healthcheck reaches this endpoint directly over FastCGI.
; [PL] Healthcheck dociera do tego endpointu bezpośrednio przez FastCGI.
ping.path = /ping
ping.response = pong
pm.status_path = /status

; [EN] Prevent arbitrary script extensions from being executed as PHP.
; [PL] Zapobiegaj wykonywaniu dowolnych rozszerzeń plików jako PHP.
security.limit_extensions = .php

; [EN] Worker output is visible through docker logs.
; [PL] Wyjście workerów jest widoczne przez docker logs.
catch_workers_output = yes
decorate_workers_output = no

; [EN] Application code does not need the container environment after wp-config.php is generated.
; [PL] Kod aplikacji nie potrzebuje środowiska kontenera po wygenerowaniu wp-config.php.
clear_env = yes

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
