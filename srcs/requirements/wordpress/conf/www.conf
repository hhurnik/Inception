; This pool executes WordPress as Debian's unprivileged web user.
[www]
user = www-data
group = www-data

; Listen on the private Docker network, not on a published host port.
listen = 0.0.0.0:9000

; A small dynamic pool is sufficient for the educational VM.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; The healthcheck reaches this endpoint directly over FastCGI.
ping.path = /ping
ping.response = pong
pm.status_path = /status

; Prevent arbitrary script extensions from being executed as PHP.
security.limit_extensions = .php

; Worker output is visible through docker logs.
catch_workers_output = yes
decorate_workers_output = no

; Application code does not need the container environment after wp-config.php is generated.
clear_env = yes

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
