; [EN] PHP-FPM writes its PID under a writable runtime directory.
; [PL] PHP-FPM zapisuje PID w zapisywalnym katalogu runtime.
[global]
pid = /run/php/php8.2-fpm.pid

; [EN] Send master-process errors to Docker's stderr stream.
; [PL] Wysyłaj błędy procesu głównego do strumienia stderr Dockera.
error_log = /proc/self/fd/2
log_level = notice

; [EN] Foreground mode is also enforced by the -F command-line flag.
; [PL] Tryb pierwszoplanowy jest również wymuszany flagą -F w linii poleceń.
daemonize = no

include = /etc/php/8.2/fpm/pool.d/*.conf
