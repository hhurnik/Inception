; PHP-FPM writes its PID under a writable runtime directory.
[global]
pid = /run/php/php8.2-fpm.pid

; Send master-process errors to Docker's stderr stream.
error_log = /proc/self/fd/2
log_level = notice

; Foreground mode is also enforced by the -F command-line flag.
daemonize = no

include = /etc/php/8.2/fpm/pool.d/*.conf
