#The project name produces predictable resource names and an explicit network name.
name: inception

services:
  mariadb:
    #The service builds its own image from Debian; no ready-made MariaDB image is pulled.
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb:1.0
    container_name: mariadb
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - db_root_password
      - db_password
    volumes:
      - type: volume
        source: mariadb_data
        target: /var/lib/mysql
        volume:
          nocopy: true
    networks:
      - inception
    healthcheck:
      test: ["CMD", "/usr/local/bin/mariadb-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  wordpress:
    #This image contains WordPress and PHP-FPM only; it does not install NGINX.
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress:1.0
    container_name: wordpress
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - type: volume
        source: wordpress_data
        target: /var/www/html
        volume:
          nocopy: true
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/wordpress-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  nginx:
    #NGINX is the only public entry point and the only service publishing a host port.
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx:1.0
    container_name: nginx
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      #NGINX needs WordPress files for static content, but it never writes to them.
      - type: volume
        source: wordpress_data
        target: /var/www/html
        read_only: true
        volume:
          nocopy: true
    networks:
      - inception
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error --insecure --resolve $${DOMAIN_NAME}:443:127.0.0.1 https://$${DOMAIN_NAME}/healthz >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

#A user-defined bridge network provides isolation and service-name DNS.
networks:
  inception:
    name: inception
    driver: bridge

#These are Docker named volumes. The local driver places their data in the required host paths.
volumes:
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb
  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress

#Compose mounts each secret as a read-only file under /run/secrets in authorized services.
secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
